name: Promote and clean v1.30 source
on:
  push:
    branches: [promote-clean-v130]
    paths: ['.github/workflows/promote-clean-v130.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean obsolete files and update package version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.github/workflows').glob('*.yml'): p.unlink()
          for name in ['build_header_v129.sh','build_jit_v128.sh','build_appearance_v130.sh']:
              Path('scripts',name).unlink()
          for p in Path('tests').glob('*.cjs'):
              if p.name != 'header-appearance-v130.cjs': p.unlink()
          Path('docs/header-v129.md').unlink()
          p=Path('scripts/package.sh')
          s=p.read_text().replace('1.0.129','1.0.130').replace('0.19.0-129','0.19.0-130').replace('# v1.29 includes','# v1.30 includes')
          p.write_text(s)
          Path('.gitignore').write_text('build/\ndist/\nnode_modules/\n__pycache__/\n*.pyc\nprefs/.theos/\nprefs/Resources/icon.png\n')
          p=Path('docs/appearance-v130.md')
          p.write_text(p.read_text().replace('Main and stable-v1.29 remain available.','The main branch contains the complete v1.30 source; stable-v1.29 preserves the previous baseline.'))
          p=Path('README.md')
          p.write_text(p.read_text()+'\nCurrent release: **1.30** — adaptive Appearance header colour and a strip aligned with the button edges.\n\n[Download 1.30](https://github.com/551UK/ChatGPT-App-iOS16/releases/tag/chatgpt-appearance-v130) · [Build and verification](docs/build.md)\n')
          PY
          cat > scripts/verify_release_v130.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")/.."
          mkdir -p dist
          file=dist/com.551uk.chatgptgecko_0.19.0-130_iphoneos-arm64.deb
          curl -fL --retry 3 https://github.com/551UK/ChatGPT-App-iOS16/releases/download/chatgpt-appearance-v130/com.551uk.chatgptgecko_0.19.0-130_iphoneos-arm64.deb -o "$file"
          echo "b96fc3db45d65e91cc8c404a1e0f3d266b190809e10d1ba0fabe0805f8546bb3  $file" | sha256sum -c -
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          dpkg-deb -x "$file" "$work"
          embedded=$(find "$work" -path '*/extensions/readerview/chatgpt-app-shell.js' -type f)
          test -n "$embedded"
          cmp web/chatgpt-app-shell.js "$embedded"
          test "$(dpkg-deb -f "$file" Version)" = "0.19.0-130"
          echo "Verified exact released v1.30 package and matching presentation source"
          SH
          cat > docs/build.md <<'DOC'
          # Build and verify 1.30
          
          The repository contains the native app shell (src), settings bundle (prefs), Gecko presentation script (web), packaging tools (scripts), and regression tests (tests).
          
          For a source build, use macOS with Xcode/iOS SDK, Theos and its SDKs, ldid, dpkg-deb, Python 3 and Pillow. Set THEOS to the Theos checkout, then run:
          
          ```sh
          bash scripts/package.sh
          ```
          
          This downloads upstream Reynard 0.19.0, compiles the native shell and settings bundle, applies the guarded XUL repair, signs the binaries, and packages version 0.19.0-130 in dist. Upstream Gecko is a downloaded dependency, not vendored source.
          
          To download and verify the exact published package on Linux:
          
          ```sh
          bash scripts/verify_release_v130.sh
          ```
          
          This checks its SHA-256, package version and embedded presentation script against this checkout. The published package preserves the v1.29 native binaries; a fresh source build is not guaranteed byte-identical.
          
          Firefox regression tests:
          
          ```sh
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
          node tests/header-appearance-v130.cjs
          ```
          
          The guarded XUL patch and its ARM64 regression harness remain in scripts/patch_xul_active_stub.py and tests/jit-active-stub-v128.py; see docs/jit-v128.md for the original investigation.
          DOC
          cat > .github/workflows/validate.yml <<'YML'
          name: Validate ChatGPT 1.30
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            validate:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - run: |
                    node --check web/chatgpt-app-shell.js
                    bash -n scripts/package.sh scripts/verify_release_v130.sh
                    python3 -m py_compile scripts/*.py
                - run: |
                    npm install --no-save playwright@1.56.1
                    npx playwright install --with-deps firefox
                    node tests/header-appearance-v130.cjs
          YML
      - name: Verify runtime source and released package
        run: |
          git diff --exit-code a80cbe8ad995af808b3f585f0edee1bf9a292ed0 -- src prefs web scripts/patch_xul_active_stub.py
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh scripts/verify_release_v130.sh
          python3 -m py_compile scripts/*.py
          bash scripts/verify_release_v130.sh
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
          node tests/header-appearance-v130.cjs
      - name: Commit cleaned source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote complete v1.30 source and remove obsolete release tooling"
          git push origin HEAD:main
