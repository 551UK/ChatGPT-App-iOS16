name: Build v1.30 appearance header
on:
  push:
    branches: [appearance-header-v130]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'tests/header-appearance-v130.cjs'
      - 'scripts/build_appearance_v130.sh'
      - '.github/workflows/build-appearance-v130.yml'
  workflow_dispatch:
concurrency:
  group: chatgpt-appearance-v130
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firefox test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
      - name: Test header lifecycle in Firefox
        run: |
          node --check web/chatgpt-app-shell.js
          node tests/header-appearance-v130.cjs
      - name: Package v1.29 engine with v1.30 presentation
        run: bash scripts/build_appearance_v130.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-v1.30-Appearance
          path: dist/*.deb
          if-no-files-found: error
      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/appearance-header-v130" --jq .commit.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then echo "Newer source exists; skipping stale publication"; exit 0; fi
          if gh release view chatgpt-appearance-v130 >/dev/null 2>&1; then
            gh release upload chatgpt-appearance-v130 dist/*.deb --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/chatgpt-appearance-v130" -f sha="$GITHUB_SHA" -F force=true
            gh release edit chatgpt-appearance-v130 --prerelease --notes-file docs/appearance-v130.md
          else
            gh release create chatgpt-appearance-v130 dist/*.deb --target "$GITHUB_SHA" --prerelease --title "ChatGPT 1.30 — Adaptive header colour" --notes-file docs/appearance-v130.md
          fi
