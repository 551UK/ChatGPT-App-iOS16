name: Finalize v1.25 as sole stable release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v125-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: chatgpt-finalize-v125
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main application matches saved v1.25 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin best-known-v1.25 --depth=1
          git diff --quiet FETCH_HEAD HEAD -- src web prefs scripts
          grep -Fq 'Version: 0.19.0-125' scripts/package.sh
          grep -Fq 'manifest["version"] = "1.0.125"' scripts/package.sh
          grep -Fq 'CGHomeRouteTitleMarker' src/ChatGPTShell.m
          grep -Fq 'syncRestorableHomeState()' web/chatgpt-app-shell.js
          grep -Fxq '# Features' README.md
          test "$(grep -c '^# ' README.md)" -eq 1

      - name: Create latest canonical v1.25 release using verified DEB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v125"
          DEB="$RUNNER_TEMP/v125/com.551uk.chatgptgecko_0.19.0-125_iphoneos-arm64.deb"
          gh release download chatgpt-last-page-v125 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'com.551uk.chatgptgecko_0.19.0-125_iphoneos-arm64.deb' \
            --dir "$RUNNER_TEMP/v125"
          test -s "$DEB"
          test "$(stat -c%s "$DEB")" = "73450200"
          test "$(dpkg-deb --field "$DEB" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$DEB" Version)" = "0.19.0-125"
          test "$(dpkg-deb --field "$DEB" Architecture)" = "iphoneos-arm64"
          if gh release view v1.25 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Canonical release exists; checking its asset."
            gh release view v1.25 --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq "$(basename "$DEB")"
          else
            gh release create v1.25 "$DEB" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ChatGPT v1.25" --notes-file README.md --latest
          fi
          gh release edit v1.25 --repo "$GITHUB_REPOSITORY" --latest
          gh release view v1.25 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "$(basename "$DEB")"
          echo "CANONICAL_V125_DEB_VERIFIED"

      - name: Remove superseded releases and old DEBs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failure=0
          while IFS= read -r tag; do
            test -n "$tag" || continue
            test "$tag" = "v1.25" && continue
            echo "Removing old release and DEB: $tag"
            if ! gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "::error::Failed to remove $tag"
              failure=1
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                     --json tagName --jq '.[].tagName')
          test "$failure" -eq 0
          test "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                    --json tagName --jq '.[].tagName')" = "v1.25"

      - name: Remove superseded DEB artifacts, preserve v1.25 backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failures=0
          while IFS=$'\t' read -r id label; do
            test -n "$id" || continue
            if test "$id" = "12882554916"; then
              echo "Retain verified v1.25 build artifact: $id"
              continue
            fi
            echo "Delete superseded build artifact $id ($label)"
            if ! gh api --method DELETE \
                 "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent; then
              echo "::warning::Failed to remove artifact $id"
              failures=1
            fi
          done < <(gh api --paginate \
                    "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
                    --jq '.artifacts[] | [.id,.name] | @tsv')
          test "$failures" -eq 0

      - name: Verify latest release and protected source branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.25 --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isPrerelease,assets \
            --jq '{name,tagName,isPrerelease,assets:[.assets[].name]}'
          gh release view v1.25 --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease' | grep -Fxq false
          for branch in main best-known-v1.25 best-known-v1.24 best-known-v1.23; do
            gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.name'
          done
          echo "FINAL_V125_VERIFIED"