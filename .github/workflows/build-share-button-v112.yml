name: Build ChatGPT v1.12 - persistent Share button sizing

on:
  push:
    branches: [fix-share-button-stable-v112]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - '.github/workflows/build-share-button-v112.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-share-v112
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Validate only share scaling JS and package version changed from v1.10
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin header-only-scaling-v110 --depth=1
          ! git diff --quiet origin/header-only-scaling-v110 HEAD -- web/chatgpt-app-shell.js
          git diff --quiet origin/header-only-scaling-v110 HEAD -- src prefs scripts/rebrand.py scripts/inject.py scripts/icon.py
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh
          grep -Fq 'function keepHeaderShareEnlarged(allControls)' web/chatgpt-app-shell.js
          grep -Fq 'html body .cg-ios16-share-control-stable { transform: scale(1.30)' web/chatgpt-app-shell.js
          grep -Fq '!old.classList.contains("cg-ios16-share-control-stable")' web/chatgpt-app-shell.js
          grep -Fq '#browser-sidebar-popover { width: 75vw' web/chatgpt-app-shell.js
          grep -Fq 'nav[aria-label=' web/chatgpt-app-shell.js
          grep -Fq 'manifest["version"] = "1.0.112"' scripts/package.sh
          grep -Fq 'Version: 0.19.0-112' scripts/package.sh
      - name: Build preserved v1.10 with Share-button fix
        run: bash scripts/package.sh
      - name: Inspect app bundle and DEB
        shell: bash
        run: |
          set -euo pipefail
          f=dist/com.551uk.chatgptgecko_0.19.0-112_iphoneos-arm64.deb
          test -s "$f"
          test "$(dpkg-deb --field "$f" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$f" Version)" = "0.19.0-112"
          test "$(dpkg-deb --field "$f" Architecture)" = "iphoneos-arm64"
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          app=Path("build/work/unpacked/Payload/ChatGPT.app")
          assert plistlib.loads((app/"Info.plist").read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16"
          helper=app/"PlugIns/Reynard Helper.appex/Info.plist"
          assert plistlib.loads(helper.read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16.Helper"
          manifest=next(app.rglob("extensions/readerview/manifest.json"))
          m=json.loads(manifest.read_text())
          assert m["version"]=="1.0.112"
          assert any("chatgpt-app-shell.js" in e.get("js",[]) for e in m.get("content_scripts",[]))
          content=(manifest.parent/"chatgpt-app-shell.js").read_text()
          assert "keepHeaderShareEnlarged(allControls)" in content
          assert "cg-ios16-share-control-stable" in content
          print("PASS: Gecko helper and custom UI script included, Share always-large fix present")
          PY
          sha256sum "$f"
      - name: Upload signed-rootless build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-112-Share-Stable
          path: dist/com.551uk.chatgptgecko_0.19.0-112_iphoneos-arm64.deb
      - name: Publish direct release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create chatgpt-share-stable-v112 dist/com.551uk.chatgptgecko_0.19.0-112_iphoneos-arm64.deb --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChatGPT v1.12 — Keep Share button enlarged through sidebar" --notes "Built from preserved v1.10 baseline. Keeps Share at 130% independently of temporary sidebar visibility, avoids clearing header sizing when the drawer is open, and excludes sidebar elements from conversation header detection. No change to Gecko helper, native shell, Settings or other visual features. Test build; confirm on device."
