name: Build ChatGPT v1.10 prevent chat-title enlargement
on:
  push:
    branches: [header-only-scaling-v110]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - 'tests/header-icons-streaming-v109.test.cjs'
      - 'tests/header-only-scaling-v110.test.cjs'
      - '.github/workflows/build-release-v110.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm v1.09 fixes unchanged and chat-title resizing blocked
        run: |
          set -euo pipefail
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh
          git diff --exit-code origin/top-icons-persist-streaming-v109 HEAD -- src prefs
          grep -Fq 'Version: 0.19.0-110' scripts/package.sh
          grep -Fq 'manifest["version"] = "1.0.110"' scripts/package.sh
          node <<'JS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const original = cp.execFileSync('git', ['show','origin/top-icons-persist-streaming-v109:web/chatgpt-app-shell.js'], {encoding:'utf8'});
          const actual = fs.readFileSync('web/chatgpt-app-shell.js','utf8');
          const old1 = "    const visibleTopControls = allControls.filter((element) => {\n      const rect = element.getBoundingClientRect();";
          const new1 = "    const visibleTopControls = allControls.filter((element) => {\n      // v1.10: Never classify chat-history entries, message controls or\n      // other iconless text links as top-header icons. When a sidebar list\n      // scrolls past the first 140px, v1.08/v1.09 could mistakenly scale\n      // its chat titles as if they were toolbar buttons.\n      if (element.closest(\"#browser-sidebar-popover, nav[aria-label='Chat history'], [data-message-author-role], [data-testid^='conversation-turn']\")) return false;\n      if (!element.querySelector(\"svg\")) return false;\n      // A normal chat-title row may contain an SVG too. Header buttons are\n      // icon-only, apart from a short set of native accessible control labels.\n      const label = normalizedText(element).trim().toLowerCase();\n      if (label && !/^(share|new chat|create new chat|open sidebar|close sidebar|toggle sidebar)$/.test(label)) return false;\n      const rect = element.getBoundingClientRect();\n      if (rect.width > 110 || rect.height > 85) return false;";
          const oldSvg = "      if (svg.closest(\".cg-ios16-sidebar-title-offset\")) continue;";
          const newSvg = "      if (svg.closest(\".cg-ios16-sidebar-title-offset, #browser-sidebar-popover, nav[aria-label='Chat history'], [data-message-author-role], [data-testid^='conversation-turn']\")) continue;";
          assert.equal(original.split(old1).length, 2);
          assert.equal(original.split(oldSvg).length, 2);
          assert.equal(actual, original.replace(old1,new1).replace(oldSvg,newSvg), 'Unexpected changes to working v1.09 baseline');
          assert(actual.includes('#browser-sidebar-popover { width: 75vw !important; }'), 'Known-good sidebar width missing');
          console.log('PASS: v1.09 preserved except safe header-only selection filters.');
          JS
          node tests/header-icons-black.test.cjs
          node tests/header-icons-streaming-v109.test.cjs
          node tests/header-only-scaling-v110.test.cjs
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build v1.10
        run: bash scripts/package.sh
      - name: Verify rootless DEB
        run: |
          set -euo pipefail
          file=dist/com.551uk.chatgptgecko_0.19.0-110_iphoneos-arm64.deb
          test -s "$file"
          test "$(dpkg-deb --field "$file" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$file" Version)" = "0.19.0-110"
          test "$(dpkg-deb --field "$file" Architecture)" = "iphoneos-arm64"
          dpkg-deb --contents "$file" > /tmp/chatgpt-v110-contents.txt
          grep -Fq 'ChatGPT.app/' /tmp/chatgpt-v110-contents.txt
          grep -Fq 'ChatGPTPrefs.bundle/' /tmp/chatgpt-v110-contents.txt
          shasum -a 256 "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-110-header-only-scale-fix
          path: dist/com.551uk.chatgptgecko_0.19.0-110_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Release v1.10 test file without touching stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=dist/com.551uk.chatgptgecko_0.19.0-110_iphoneos-arm64.deb
          if ! gh release view v1.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.10 --repo "$GITHUB_REPOSITORY" --target header-only-scaling-v110 --prerelease --title "ChatGPT v1.10 - Prevent Chat Titles Enlarging While Scrolling" --notes "Build from v1.09 with v1.08 working 75vw sidebar preserved. Corrects accidental enlargement of scrolling chat titles by excluding chat-history and message content from top-header detection; only small SVG header controls may be scaled. Keeps v1.09 persistent black header icons."
          fi
          success=0
          for attempt in 1 2 3 4; do
            if gh release upload v1.10 "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Release upload attempt $attempt failed. Retrying."
            sleep 5
          done
          test "$success" = 1
          gh release view v1.10 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name,.size,.url] | @tsv'
