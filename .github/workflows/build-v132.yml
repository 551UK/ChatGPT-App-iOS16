name: Build ChatGPT 1.32
on:
  push:
    branches: [fix-home-startup-v132]
    paths: ['web/chatgpt-app-shell.js', 'tests/header-appearance-v130.cjs', 'tests/home-startup-v132.cjs', '.github/workflows/build-v132.yml']
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Stop superseded test runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 551UK/ChatGPT-App-iOS16
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=fix-home-startup-v132&per_page=30" --jq '.workflow_runs[] | select(.status != "completed") | .id' | while read -r id; do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || true; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test startup and header lifecycle
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
          node --check web/chatgpt-app-shell.js
          git fetch origin tag chatgpt-v131
          git show chatgpt-v131:web/chatgpt-app-shell.js > /tmp/baseline.js
          if HEADER_SOURCE=/tmp/baseline.js node tests/home-startup-v132.cjs; then
            echo 'Expected the old Home startup bug to reproduce'; exit 1
          fi
          node tests/home-startup-v132.cjs
          node tests/header-appearance-v130.cjs
      - name: Package verified baseline
        run: |
          mkdir -p build dist
          curl -fL --retry 3 https://github.com/551UK/ChatGPT-App-iOS16/releases/download/chatgpt-v131/com.551uk.chatgptgecko_0.19.0-131_iphoneos-arm64.deb -o build/base.deb
          echo 'b256ea2e940901f8d66907212c8fb358a1772be19d9d0b4ab33553a043d083ea  build/base.deb' | sha256sum -c -
          dpkg-deb -R build/base.deb build/root
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('build/root')
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={str(p.relative_to(root)):digest(p) for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          manifest=next(root.rglob('extensions/readerview/manifest.json'))
          shell=manifest.parent/'chatgpt-app-shell.js'
          shell.write_bytes(Path('web/chatgpt-app-shell.js').read_bytes())
          m=json.loads(manifest.read_text())
          assert m['version']=='1.0.131'
          m['version']='1.0.132'
          manifest.write_text(json.dumps(m,indent=2)+'\n')
          control=root/'DEBIAN/control'
          s=control.read_text()
          assert 'Version: 0.19.0-131\n' in s
          control.write_text(s.replace('Version: 0.19.0-131\n','Version: 0.19.0-132\n'))
          after={str(p.relative_to(root)):digest(p) for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          assert before.keys()==after.keys()
          assert {p for p in before if before[p]!=after[p]}=={str(p.relative_to(root)) for p in [manifest,shell,control]}
          print('PASS: only presentation script and package/extension versions changed')
          PY
          dpkg-deb --root-owner-group -Zxz --build build/root dist/com.551uk.chatgptgecko_0.19.0-132_iphoneos-arm64.deb
          sha256sum dist/*.deb
      - name: Publish with empty description, then remove old deb assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 551UK/ChatGPT-App-iOS16
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/git/ref/heads/fix-home-startup-v132 --jq .object.sha)" = "$GITHUB_SHA"
          gh release create chatgpt-v132 dist/*.deb --target "$GITHUB_SHA" --title "ChatGPT 1.32" --notes "" --latest
          gh api repos/$GH_REPO/releases/tags/chatgpt-v132 > /tmp/release.json
          expected=$(sha256sum dist/*.deb | cut -d' ' -f1)
          jq -e --arg digest "sha256:$expected" '.assets | length == 1 and .[0].digest == $digest' /tmp/release.json
          gh api --paginate repos/$GH_REPO/releases --jq '.[] | select(.tag_name != "chatgpt-v132") | .id' > /tmp/old-assets
          while read -r id; do
            gh api --method DELETE repos/$GH_REPO/releases/$id
          done < /tmp/old-assets
