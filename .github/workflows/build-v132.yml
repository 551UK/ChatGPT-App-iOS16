name: Verify ChatGPT 1.32
on:
  push:
    branches: [fix-home-startup-v132]
    paths: ['web/chatgpt-app-shell.js', 'tests/**', 'scripts/**', '.github/workflows/build-v132.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Stop superseded checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 551UK/ChatGPT-App-iOS16
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=fix-home-startup-v132&per_page=30" --jq '.workflow_runs[] | select(.status != "completed") | .id' | while read -r id; do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || true; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and verify published source
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
          node --check web/chatgpt-app-shell.js
          node tests/home-startup-v132.cjs
          node tests/header-appearance-v130.cjs
          bash scripts/verify_release_v130.sh
