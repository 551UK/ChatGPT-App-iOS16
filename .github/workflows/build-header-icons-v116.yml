name: Build ChatGPT v1.16 - restore header icon sizing after sidebar close

on:
  push:
    branches: [header-icon-size-recovery-v116]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - '.github/workflows/build-header-icons-v116.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-header-icons-v116
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Verify isolated fix based on v1.15 preserved source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin baseline-v115-working-preserved --depth=1
          git diff --quiet origin/baseline-v115-working-preserved HEAD -- src prefs scripts/rebrand.py scripts/inject.py scripts/icon.py
          ! git diff --quiet origin/baseline-v115-working-preserved HEAD -- web/chatgpt-app-shell.js
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh
          python3 - <<'PY_CHECK'
          from pathlib import Path
          js = Path("web/chatgpt-app-shell.js").read_text()
          code = js.split("function restoreMainHeaderLeftIconSizes(chosenSvgs) {", 1)[1].split("\n  // v1.01", 1)[0]
          assert "stabilizeTopActionBar" not in code
          assert "keepHeaderShareEnlarged" not in code
          assert "button.closest(panelSelector)" in code
          assert "pair.length !== 2" in code
          assert 'data-cg-left-header-icon' in code
          assert 'restoreMainHeaderLeftIconSizes(chosen);' in js
          assert "html body .cg-ios16-left-header-size-stable" in js
          assert "makeTopLeftHeaderIconsBlack();" in js
          assert "recoverHeaderInkAfterTransition()" in js
          assert "schedule(mutationChangesHeader(mutations))" in js
          assert '#browser-sidebar-popover { width: 75vw' in js
          assert 'html body .cg-ios16-share-control-stable { transform: scale(1.30)' in js
          print("PASS: restore main header icon sizes without touching the sidebar dismiss control or Share")
          PY_CHECK
          grep -Fq 'manifest["version"] = "1.0.116"' scripts/package.sh
          grep -Fq 'Version: 0.19.0-116' scripts/package.sh
      - name: Package ChatGPT v1.16
        run: bash scripts/package.sh
      - name: Inspect rootless DEB and embedded styling script
        shell: bash
        run: |
          set -euo pipefail
          f=dist/com.551uk.chatgptgecko_0.19.0-116_iphoneos-arm64.deb
          test -s "$f"
          test "$(dpkg-deb --field "$f" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$f" Version)" = "0.19.0-116"
          test "$(dpkg-deb --field "$f" Architecture)" = "iphoneos-arm64"
          python3 - <<'PY_CHECK'
          import json, plistlib
          from pathlib import Path
          app=Path("build/work/unpacked/Payload/ChatGPT.app")
          assert plistlib.loads((app/"Info.plist").read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16"
          helper=app/"PlugIns/Reynard Helper.appex/Info.plist"
          assert plistlib.loads(helper.read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16.Helper"
          manifest=next(app.rglob("extensions/readerview/manifest.json"))
          m=json.loads(manifest.read_text())
          assert m["version"]=="1.0.116"
          assert any("chatgpt-app-shell.js" in e.get("js",[]) for e in m.get("content_scripts",[]))
          code=(manifest.parent/"chatgpt-app-shell.js").read_text()
          assert "restoreMainHeaderLeftIconSizes(chosen);" in code
          assert "cg-ios16-left-header-size-stable" in code
          print("PASS: App bundle, Gecko helper and left icon sizing script included")
          PY_CHECK
          shasum -a 256 "$f"
      - name: Upload verified DEB
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-116-Header-Icon-Size-Stable
          path: dist/com.551uk.chatgptgecko_0.19.0-116_iphoneos-arm64.deb
      - name: Publish optional testing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create chatgpt-header-size-v116 \
            dist/com.551uk.chatgptgecko_0.19.0-116_iphoneos-arm64.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ChatGPT v1.16 — Stable header icon sizes after sidebar close" \
            --notes "Testing update from preserved v1.15. Closing the sidebar using the SMALL button inside its panel (or backdrop) can leave the two MAIN header icons at native size. The v1.15 ink-only recovery now also re-applies stable sizing to the two main header controls: sidebar 140%, New Chat 150%, irrespective of order. The internal sidebar close control is excluded. Share 130%, black icon ink, sidebar width, chat-title protections, native Gecko shell and Settings stay unchanged. v1.15 preserved as fallback. Confirm on iPhone before calling this version stable."