name: Build ChatGPT v0.98 sidebar title position test
on:
  push:
    branches: [sidebar-title-right-v098]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - '.github/workflows/build-release-v098.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify untouched v0.94 native app and precise title-only change
        run: |
          set -euo pipefail
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh
          git diff --exit-code origin/best-known-v0.94 HEAD -- src prefs
          grep -Fq 'Version: 0.19.0-98' scripts/package.sh
          grep -Fq 'manifest["version"] = "1.0.98"' scripts/package.sh
          node <<'JS'
          const fs = require('fs');
          const js = fs.readFileSync('web/chatgpt-app-shell.js', 'utf8');
          if (!js.includes('.cg-ios16-sidebar-title-offset { translate: 10% 0 !important; }')) throw Error('Missing 10% group translation');
          if (!js.includes('positionSidebarTitleAndChevron();')) throw Error('Missing live application of title movement');
          if (!js.includes('svgs.length < 1 || svgs.length > 2')) throw Error('Must reject other header buttons');
          if (js.includes('resizeSidebarText()')) throw Error('Must not import v0.97 sidebar font changes');
          for (const unchanged of [
            ".cg-ios16-topbar-control[data-cg-icon-role='sidebar'] { transform: scale(1.40) !important; }",
            ".cg-ios16-topbar-control[data-cg-icon-role='new'] { transform: scale(1.50) !important; }"
          ]) if (!js.includes(unchanged)) throw Error('v0.94 icon sizes changed unexpectedly');
          JS
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build v0.98
        run: bash scripts/package.sh
      - name: Verify rootless DEB
        run: |
          set -euo pipefail
          file=dist/com.551uk.chatgptgecko_0.19.0-98_iphoneos-arm64.deb
          test -s "$file"
          test "$(dpkg-deb --field "$file" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$file" Version)" = "0.19.0-98"
          test "$(dpkg-deb --field "$file" Architecture)" = "iphoneos-arm64"
          dpkg-deb --contents "$file" > /tmp/chatgpt-v098-contents.txt
          grep -Fq 'ChatGPT.app/' /tmp/chatgpt-v098-contents.txt
          grep -Fq 'ChatGPTPrefs.bundle/' /tmp/chatgpt-v098-contents.txt
          shasum -a 256 "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-98-sidebar-title-position
          path: dist/com.551uk.chatgptgecko_0.19.0-98_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Publish separate test prerelease without modifying v0.94
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=dist/com.551uk.chatgptgecko_0.19.0-98_iphoneos-arm64.deb
          if gh release view v0.98 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.98 "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.98 "$file" --repo "$GITHUB_REPOSITORY" --target sidebar-title-right-v098 --prerelease --title "ChatGPT v0.98 - Sidebar Title Position Test" --notes "Fresh branch from user-confirmed v0.94. Changes only the sidebar ChatGPT title + chevron horizontal offset by 10% of the title group's width. No font resizing, no icon changes, no v0.97 sidebar text logic. v0.94 remains untouched."
          fi
          gh release view v0.98 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name,.size,.url] | @tsv'
