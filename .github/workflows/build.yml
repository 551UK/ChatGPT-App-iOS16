name: Build ChatGPT App (iOS 16)

on:
  push:
    branches: [homepage-icon-scale-140-v84]
  workflow_dispatch:

concurrency:
  group: chatgpt-gecko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v0.59 baseline and preview-only source delta
        run: |
          set -euo pipefail
          node --check web/chatgpt-app-shell.js
          # No long-press handler or replacement menu in the web script.
          ! grep -Fq 'installSidebarChatLongPress' web/chatgpt-app-shell.js
          # Native app, Settings and media fix remain exactly v0.59.
          git diff --exit-code ce8fe63c815d043b4c43722af9335ad076ae2d2e HEAD -- src/ChatGPTShell.m src/ChatGPTDataMaintenance.m src/ChatGPTRemoteRegistration.m prefs scripts/rebrand.py
          # Suppression of native conversation link previews remains exactly v0.83.
          git diff --exit-code fd94e099d75f2a3e4e2327de612838ab20f16cd8 HEAD -- src/ChatGPTContextMenu.m
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          original=subprocess.check_output(["git","show","fd94e099d75f2a3e4e2327de612838ab20f16cd8:web/chatgpt-app-shell.js"],text=True)
          actual=Path("web/chatgpt-app-shell.js").read_text()
          assert original.count('".cg-ios16-topbar-control { transform: scale(1.30)') == 1
          assert actual.count('".cg-ios16-topbar-control { transform: scale(1.30)') == 1
          assert actual.count('".cg-ios16-topbar-control.cg-ios16-home-topbar-control { transform: scale(1.40)') == 1
          assert 'const homeHeader = isHomeRoute || hasHomeSwitcher;' in actual
          assert 'if (homeHeader) element.classList.add("cg-ios16-home-topbar-control");' in actual
          assert 'if (!homeHeader || !scaleControls.includes(old))' in actual
          assert 'old.classList.remove("cg-ios16-home-topbar-control");' in actual
          assert 'installSidebarChatLongPress' not in actual
          assert 0 < len(actual)-len(original) < 1500, "Unexpected presentation-layer edit size"
          print("PASS: homepage corners 140%, chat icons 130%, native preview suppression unchanged")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base="ce8fe63c815d043b4c43722af9335ad076ae2d2e"
          old=subprocess.check_output(["git","show",f"{base}:src/ChatGPTContextMenu.m"],text=True)
          new=Path("src/ChatGPTContextMenu.m").read_text()
          assert "CGIsConversationLink" not in old
          assert "static BOOL CGIsConversationLink" in new
          assert "if (CGIsConversationLink(identifier)) return nil;" in new
          assert "CGMenuWithoutBrowserTabs" in new
          assert "UIContextMenuConfiguration" in new
          assert "chatgpt-app-shell.js" not in new
          assert "Copy Link" in new and "Share Link" in new
          assert "installSidebarChatLongPress" not in new
          assert "Version: 0.19.0-84" in Path("scripts/package.sh").read_text()
          assert 'manifest["version"] = "1.0.36"' in Path("scripts/package.sh").read_text()
          print("PASS: v0.59 core + v0.83 preview suppression + home-only icon enlargement")
          PY
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'

      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Prove known-good native and Settings code remain unchanged
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          # Audit against v0.56, the deterministic cleanup-before-tab baseline.
          # v0.57's duplicate/conditional constructor and v0.58's saved session
          # rewrite must both be absent; the only runtime edit is one-shot clear.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import difflib
          base = "8d270d334ed84fdf26a1ccdc6bb02c35d33ff1fe"
          shell = subprocess.check_output(["git","show",f"{base}:src/ChatGPTShell.m"],text=True)
          assert Path("src/ChatGPTShell.m").read_text() == shell, "Startup shell changed from v0.56"
          assert "CGRunPendingDataMaintenance();" in shell
          assert "CGHasPendingDataClear" not in shell
          assert "tab_session_state=NULL" not in shell
          baseline = subprocess.check_output(["git","show",f"{base}:src/ChatGPTDataMaintenance.m"],text=True)
          source = Path("src/ChatGPTDataMaintenance.m").read_text()
          assert "void CGRunPendingDataMaintenance(void)" in source
          assert "CGHasPendingDataClear" not in source
          assert "CGNormalStartupHistoryPolicy" not in source
          assert "if (mask) CGWriteClearMask(0);" in source
          assert "CGWriteClearMask(incomplete)" not in source
          prior, now = baseline.splitlines(keepends=True), source.splitlines(keepends=True)
          edits=[(op,prior[i:j],now[k:l]) for op,i,j,k,l in
            difflib.SequenceMatcher(a=prior,b=now,autojunk=False).get_opcodes() if op != "equal"]
          assert len(edits) == 3, f"Unexpected changes to cleanup source: {len(edits)}"
          assert "Individual selected categories can be retried" in "".join(edits[0][1])
          assert "Consume the request BEFORE touching any files" in "".join(edits[1][2])
          assert "CGWriteClearMask(incomplete)" in "".join(edits[2][1])
          assert "no automatic retries" in "".join(edits[2][2])
          print("PASS: clean v0.56 startup + one-shot cleanup; failed v0.57/v0.58 experiments absent")
          PY
          git diff --exit-code origin/main HEAD -- prefs/PreferenceLoader.plist prefs/Resources/Info.plist
          test -s src/ChatGPTContextMenu.m
          grep -Fq 'CGChatGPTContextMenuFactory' src/ChatGPTContextMenu.m
          grep -Fq 'ChatGPTContextMenu.m' scripts/package.sh
          test -s src/ChatGPTRemoteRegistration.m
          grep -Fq 'CGRejectBrowserRemoteHandler' src/ChatGPTRemoteRegistration.m
          grep -Fq 'addTargetWithHandler:' src/ChatGPTRemoteRegistration.m
          grep -Fq 'ChatGPTRemoteRegistration.m' scripts/package.sh
          grep -Fq -- '-framework MediaPlayer' scripts/package.sh
          echo "PASS: one deterministic startup, one-shot cleanup, native UI and v0.54 media fix preserved"

      - name: Package Gecko-based ChatGPT app
        run: bash scripts/package.sh
      - name: Verify app content and Mach-O load command
        run: |
          set -euo pipefail
          test -s dist/ChatGPT-Gecko-iOS16.ipa
          test -s dist/com.551uk.chatgptgecko_0.19.0-84_iphoneos-arm64.deb
          dpkg-deb --field dist/*.deb Architecture | grep -Fx 'iphoneos-arm64'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Applications/ChatGPT.app/Info.plist'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Library/PreferenceBundles/ChatGPTPrefs.bundle/ChatGPTPrefs'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Library/PreferenceBundles/ChatGPTPrefs.bundle/Info.plist'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Library/PreferenceBundles/ChatGPTPrefs.bundle/Root.plist'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Library/PreferenceBundles/ChatGPTPrefs.bundle/icon.png'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Library/PreferenceLoader/Preferences/ChatGPT.plist'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Library/PreferenceLoader/Preferences/ChatGPT.png'
          dpkg-deb --field dist/*.deb Depends | grep -F 'preferenceloader'
          MAIN="$(find build/work/unpacked/Payload -maxdepth 2 -name Reynard -type f | head -1)"
          otool -L "$MAIN" | grep -F '@executable_path/Frameworks/ChatGPTShell.dylib'
          test -s build/work/unpacked/Payload/ChatGPT.app/AppIcon60x60@3x.png
          test -s build/work/unpacked/Payload/ChatGPT.app/StartupLoaderIcon.png
          test -d 'build/work/unpacked/Payload/ChatGPT.app/PlugIns/Reynard Helper.appex'
          test ! -d 'build/work/unpacked/Payload/ChatGPT.app/PlugIns/OpenIn.appex'
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("build/work/unpacked/Payload/ChatGPT.app")
          app = plistlib.loads((root / "Info.plist").read_bytes())
          helper = plistlib.loads((root / "PlugIns/Reynard Helper.appex/Info.plist").read_bytes())
          assert app["CFBundleIdentifier"] == "com.551uk.chatgptios16"
          assert app["CFBundleDisplayName"] == "ChatGPT"
          assert "CFBundleURLTypes" not in app, "ChatGPT must never claim Reynard/http/https URL schemes"
          assert helper["CFBundleIdentifier"] == "com.551uk.chatgptios16.Helper"
          assert "NSMicrophoneUsageDescription" in app
          assert "NSMicrophoneUsageDescription" in helper
          print("Verified app isolation: separate app/profile/helper, microphone declarations, no browser URL schemes")
          PY
          grep -Fq 'CGRunPendingDataMaintenance();' src/ChatGPTShell.m
          grep -Fq 'void CGRunPendingDataMaintenance(void)' src/ChatGPTDataMaintenance.m
          grep -Fq 'CGControllerDidLayout' src/ChatGPTShell.m
          grep -Fq 'CGAlwaysHideChrome' src/ChatGPTShell.m
          grep -Fq 'UIScreenEdgePanGestureRecognizer' src/ChatGPTShell.m
          grep -Fq 'goBackKeyCommand:' src/ChatGPTShell.m
          grep -Fq 'CGBottomToolbarBounds' src/ChatGPTShell.m
          grep -Fq 'scrollToHideToolbarEnabled' src/ChatGPTShell.m
          grep -Fq 'CGToolbarRelayoutKey' src/ChatGPTShell.m
          grep -Fq 'ChatGPTNativeStartupLoader' src/ChatGPTShell.m
          grep -Fq 'ChatGPTStartupIconSpin' src/ChatGPTShell.m
          grep -Fq 'Reynard.ActionBar' src/ChatGPTShell.m
          grep -Fq 'CGInstallFocusedInputClearanceAdjustment' src/ChatGPTShell.m
          grep -Fq 'requested.ty + 12.0' src/ChatGPTShell.m
          ! grep -Fq 'CGInstallFocusedInputRelocationSuppression' src/ChatGPTShell.m
          ! grep -Fq 'CGKeyboardVisible' src/ChatGPTShell.m
          grep -Fq 'StartupLoaderIcon.png' src/ChatGPTShell.m
          ! grep -Fq 'UIActivityIndicatorView' src/ChatGPTShell.m
          ! grep -Fq 'label.text = @"ChatGPT"' src/ChatGPTShell.m
          grep -Fq 'CGStartupPageReady' src/ChatGPTShell.m
          grep -Fq 'CGStartupTitleMarker' src/ChatGPTShell.m
          grep -Fq 'CGPreallowChatGPTMicrophoneSite' src/ChatGPTShell.m
          grep -Fq 'What can you do?' web/chatgpt-app-shell.js
          grep -Fq 'chatgpt is ai and can make mistakes' web/chatgpt-app-shell.js
          grep -Fq 'chats may be reviewed and used to improve our ai models' web/chatgpt-app-shell.js
          grep -Fq 'data-cg-ios16-preparing' web/chatgpt-app-shell.js
          ! grep -Fq 'cg-ios16-composer' web/chatgpt-app-shell.js
          ! grep -Fq 'moveComposerDown' web/chatgpt-app-shell.js
          ! grep -Fq 'keyboardAdjustedElement' web/chatgpt-app-shell.js
          ! grep -Fq 'removeKeyboardGap' web/chatgpt-app-shell.js
          node --check web/chatgpt-app-shell.js
          grep -Fq 'dismissAppPromotion' web/chatgpt-app-shell.js
          grep -Fq 'chatgpt is better in the app' web/chatgpt-app-shell.js
          grep -Fq 'matchedNewPromo' web/chatgpt-app-shell.js
          grep -Fq 'stabilizeTopActionBar' web/chatgpt-app-shell.js
          grep -Fq 'cg-ios16-solid-topbar' web/chatgpt-app-shell.js
          grep -Fq 'renderedBackgroundColor' web/chatgpt-app-shell.js
          grep -Fq 'cg-ios16-topbar-cutoff' web/chatgpt-app-shell.js
          grep -Fq 'rowBottom' web/chatgpt-app-shell.js
          grep -Fq 'visibleTopControls' web/chatgpt-app-shell.js
          grep -Fq 'aFull' web/chatgpt-app-shell.js
          grep -Fq 'bFull' web/chatgpt-app-shell.js
          grep -Fq 'stay on web' web/chatgpt-app-shell.js
          grep -Fq 'open the app' web/chatgpt-app-shell.js
          grep -Fq 'MutationObserver' web/chatgpt-app-shell.js
          grep -Fq 'before the browser.s next paint' web/chatgpt-app-shell.js || grep -Fq "before the browser's next paint" web/chatgpt-app-shell.js
          grep -Fq '"run_at": "document_start"' scripts/package.sh
          find build/work/unpacked/Payload/ChatGPT.app -path '*/extensions/readerview/chatgpt-app-shell.js' -type f | grep -q .
          grep -Fq 'Reynard-Jailbroken.ipa' scripts/package.sh
          test -s src/ChatGPTDataMaintenance.m
          test -s src/ChatGPTDownloadOverlay.m
          grep -Fq 'DownloadStore.DidChange' src/ChatGPTDownloadOverlay.m
          grep -Fq 'DownloadStore.DidStartDownload' src/ChatGPTDownloadOverlay.m
          grep -Fq 'showDownloadsKeyCommand:' src/ChatGPTDownloadOverlay.m
          grep -Fq 'UIActivityViewController' src/ChatGPTDownloadOverlay.m
          grep -Fq 'AppData/DownloadStore' src/ChatGPTDownloadOverlay.m
          grep -Fq 'Downloading %ld%%' src/ChatGPTDownloadOverlay.m
          grep -Fq 'Downloaded' src/ChatGPTDownloadOverlay.m
          grep -Fq 'ToolbarButton' src/ChatGPTDownloadOverlay.m
          grep -Fq 'ChatGPTDownloadOverlay.m' scripts/package.sh
          grep -Fq 'ChatGPTExternalLinks.m' scripts/package.sh
          grep -Fq 'UIApplicationOpenURLOptionUniversalLinksOnly' src/ChatGPTExternalLinks.m
          grep -Fq 'Handing external URL to default browser' src/ChatGPTExternalLinks.m
          grep -Fq 'pendingClearCategories' src/ChatGPTDataMaintenance.m
          grep -Fq 'CGClearWebsitePermissions' src/ChatGPTDataMaintenance.m
          grep -Fq 'CGClearDownloads' src/ChatGPTDataMaintenance.m
          grep -Fq 'CGClearOpenTabs' src/ChatGPTDataMaintenance.m
          ! grep -Fq 'pendingClearHistory' src/ChatGPTDataMaintenance.m
          ! grep -Fq 'pendingClearCache' src/ChatGPTDataMaintenance.m
          test -s prefs/CGPClearDataController.m
          grep -Fq 'CGPClearDataController.m' prefs/Makefile
          grep -Fq 'CGTerminateChatGPT' prefs/CGPClearDataController.m
          grep -Fq 'CFSTR("pendingClearCategories")' prefs/CGPClearDataController.m
          ! grep -Fq 'Cookies and Website Data' prefs/CGPClearDataController.m
          ! grep -Fq 'clearHistory:(id)' prefs/ChatGPTPrefs.m
          ! grep -Fq 'clearCache:(id)' prefs/ChatGPTPrefs.m
          grep -Fq 'places.history.enabled' src/ChatGPTDataMaintenance.m
          grep -Fq 'cg_chatgpt_no_local_history' src/ChatGPTDataMaintenance.m
          ! grep -Fq 'cookies.sqlite' src/ChatGPTDataMaintenance.m
          ! grep -Fq 'SitePermissions' src/ChatGPTDataMaintenance.m
          ! grep -Fq 'storage/default' src/ChatGPTDataMaintenance.m
          grep -Fq 'loadSpecifiersFromPlistName:@"Root"' prefs/ChatGPTPrefs.m
          grep -Fq '<string>Clear App Data</string>' prefs/Resources/Root.plist
          grep -Fq '<string>openClearAppData:</string>' prefs/Resources/Root.plist
          ! grep -Fq '<string>clearHistory:</string>' prefs/Resources/Root.plist
          ! grep -Fq '<string>clearCache:</string>' prefs/Resources/Root.plist
          grep -Fq "<string>Don't Save Local Browsing History</string>" prefs/Resources/Root.plist
          grep -Fq '<string>View on GitHub</string>' prefs/Resources/Root.plist
          grep -Fq '<string>GOOD TO KNOW</string>' prefs/Resources/Root.plist
          grep -Fq '<string>CGPGuideCell</string>' prefs/Resources/Root.plist
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import plistlib
          import subprocess
          import tempfile

          deb = next(Path("dist").glob("*.deb"))
          with tempfile.TemporaryDirectory() as td:
              subprocess.run(["dpkg-deb", "-x", str(deb), td], check=True)
              root = Path(td)
              prefs = root / "var/jb/Library/PreferenceBundles/ChatGPTPrefs.bundle"
              entry_path = root / "var/jb/Library/PreferenceLoader/Preferences/ChatGPT.plist"
              settings_icon = root / "var/jb/Library/PreferenceLoader/Preferences/ChatGPT.png"

              assert Image.open(settings_icon).size == (29, 29)
              assert Image.open(prefs / "icon.png").size == (29, 29)

              info = plistlib.loads((prefs / "Info.plist").read_bytes())
              assert info["CFBundleDisplayName"] == "ChatGPT"
              assert info["CFBundleExecutable"] == "ChatGPTPrefs"
              assert info["NSPrincipalClass"] == "CGPRootListController"
              assert info["MinimumOSVersion"] == "16.0"

              root_plist = plistlib.loads((prefs / "Root.plist").read_bytes())
              items = root_plist["items"]
              labels = [item.get("label") for item in items if isinstance(item, dict)]
              assert "BROWSING DATA" in labels
              assert "Clear App Data" in labels
              assert "Clear Local Browsing History" not in labels
              assert "Clear Cache" not in labels
              assert "GOOD TO KNOW" in labels
              assert any(item.get("cellClass") == "CGPGuideCell" for item in items if isinstance(item, dict))
              assert any(item.get("action") == "openClearAppData:" for item in items if isinstance(item, dict))
              assert not any(item.get("action") in ("clearHistory:", "clearCache:") for item in items if isinstance(item, dict))

              entry = plistlib.loads(entry_path.read_bytes())["entry"]
              expected_icon = "/var/jb/Library/PreferenceLoader/Preferences/ChatGPT.png"
              assert entry["bundle"] == "ChatGPTPrefs"
              assert entry["detail"] == "CGPRootListController"
              assert entry["controller"] == "CGPRootListController"
              assert entry["icon"] == expected_icon
              assert entry["iconImage"] == expected_icon

              exe = prefs / "ChatGPTPrefs"
              linked = subprocess.check_output(["otool", "-L", str(exe)], text=True)
              assert "/System/Library/PrivateFrameworks/Preferences.framework/Preferences" in linked
              assert "/System/Library/Frameworks/QuartzCore.framework/QuartzCore" in linked
              subprocess.run(["xcrun", "lipo", str(exe), "-verify_arch", "arm64", "arm64e"], check=True)

          print("PASS: Root.plist Settings structure, dual architectures, black icon and framework linkage verified")
          PY
          grep -Fq 'cg-ios16-topbar-control' web/chatgpt-app-shell.js
          grep -Fq 'scale(1.30)' web/chatgpt-app-shell.js
          grep -Fq 'hasHomeSwitcher' web/chatgpt-app-shell.js
          grep -Fq 'Home page: keep ChatGPT' web/chatgpt-app-shell.js
          grep -Fq 'const isHomeRoute' web/chatgpt-app-shell.js
          grep -Fq 'window.location.pathname === "/"' web/chatgpt-app-shell.js
          test ! -e src/ChatGPTNowPlayingFix.m
          test ! -e src/ChatGPTMediaTransportGuard.m
          ! grep -Fq 'ChatGPTMediaTransportGuard.m' scripts/package.sh
          ! grep -Fq 'mode != "audio"' scripts/rebrand.py
          ! grep -Fq 'ChatGPTNowPlayingFix.m' scripts/package.sh
          grep -Fq 'if (isHomeRoute || hasHomeSwitcher)' web/chatgpt-app-shell.js
          grep -Fq 'removeProperty("--cg-ios16-topbar-bg")' web/chatgpt-app-shell.js
          grep -Fq 'eligibleRows' web/chatgpt-app-shell.js
          grep -Fq 'Math.ceil(rowBottom - bestRect.top)' web/chatgpt-app-shell.js
          ! grep -Fq 'if (!shareControl) return false' web/chatgpt-app-shell.js
          # The actual Settings loading and icon rendering must still be device-tested.
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-84-PREVIEW-SUPPRESSION-HOME-ICONS-140
          path: dist/com.551uk.chatgptgecko_0.19.0-84_iphoneos-arm64.deb
          if-no-files-found: error
