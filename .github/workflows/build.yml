name: Build ChatGPT (Gecko iOS16)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chatgpt-gecko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Package Gecko-based ChatGPT app
        run: bash scripts/package.sh
      - name: Verify app content and Mach-O load command
        run: |
          set -euo pipefail
          test -s dist/ChatGPT-Gecko-iOS16.ipa
          test -s dist/com.551uk.chatgptgecko_0.19.0-2_iphoneos-arm64.deb
          dpkg-deb --field dist/*.deb Architecture | grep -Fx 'iphoneos-arm64'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Applications/ChatGPTGecko.app/Info.plist'
          MAIN="$(find build/work/unpacked/Payload -maxdepth 2 -name Reynard -type f | head -1)"
          otool -L "$MAIN" | grep -F '@executable_path/Frameworks/ChatGPTShell.dylib'
          test -s build/work/unpacked/Payload/ChatGPT.app/AppIcon60x60@3x.png
          test -d 'build/work/unpacked/Payload/ChatGPT.app/PlugIns/Reynard Helper.appex'
          test ! -d 'build/work/unpacked/Payload/ChatGPT.app/PlugIns/OpenIn.appex'
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("build/work/unpacked/Payload/ChatGPT.app")
          app = plistlib.loads((root / "Info.plist").read_bytes())
          helper = plistlib.loads((root / "PlugIns/Reynard Helper.appex/Info.plist").read_bytes())
          assert app["CFBundleIdentifier"] == "com.551uk.chatgptgecko"
          assert app["CFBundleDisplayName"] == "ChatGPT"
          assert "CFBundleURLTypes" not in app, "ChatGPT must never claim Reynard/http/https URL schemes"
          assert helper["CFBundleIdentifier"] == "com.551uk.chatgptgecko.Helper"
          print("Verified app isolation: separate app/profile/helper, no URL schemes, no share extension")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Gecko-iOS16
          path: |
            dist/ChatGPT-Gecko-iOS16.ipa
            dist/*.deb
          if-no-files-found: error
      - name: Publish latest test IPA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Skipping outdated build release'
            exit 0
          fi
          TAG="gecko-test"
          NOTES="Experimental fix for the blank-screen startup: seeds the Gecko tab with chatgpt.com, preserves the Gecko Auto Layout and JIT entitlements. Includes a Dopamine iOS 16 rootless DEB and a TrollStore IPA. Reynard 0.19.0 / Gecko 158.0.1. Not yet device-tested."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ChatGPT-Gecko-iOS16.ipa dist/*.deb --clobber
            gh release edit "$TAG" --title 'ChatGPT Gecko iOS 16 (test)' --notes "$NOTES"
          else
            gh release create "$TAG" dist/ChatGPT-Gecko-iOS16.ipa dist/*.deb --prerelease --title 'ChatGPT Gecko iOS 16 (test)' --notes "$NOTES"
          fi
