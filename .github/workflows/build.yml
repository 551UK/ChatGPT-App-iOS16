name: Build ChatGPT (Gecko iOS16)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chatgpt-gecko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Package Gecko-based ChatGPT app
        run: bash scripts/package.sh
      - name: Verify app content and Mach-O load command
        run: |
          set -euo pipefail
          test -s dist/ChatGPT-Gecko-iOS16.ipa
          test -s dist/com.551uk.chatgptgecko_0.19.0-12_iphoneos-arm64.deb
          dpkg-deb --field dist/*.deb Architecture | grep -Fx 'iphoneos-arm64'
          dpkg-deb --contents dist/*.deb | grep -F '/var/jb/Applications/ChatGPT.app/Info.plist'
          MAIN="$(find build/work/unpacked/Payload -maxdepth 2 -name Reynard -type f | head -1)"
          otool -L "$MAIN" | grep -F '@executable_path/Frameworks/ChatGPTShell.dylib'
          test -s build/work/unpacked/Payload/ChatGPT.app/AppIcon60x60@3x.png
          test -d 'build/work/unpacked/Payload/ChatGPT.app/PlugIns/Reynard Helper.appex'
          test ! -d 'build/work/unpacked/Payload/ChatGPT.app/PlugIns/OpenIn.appex'
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("build/work/unpacked/Payload/ChatGPT.app")
          app = plistlib.loads((root / "Info.plist").read_bytes())
          helper = plistlib.loads((root / "PlugIns/Reynard Helper.appex/Info.plist").read_bytes())
          assert app["CFBundleIdentifier"] == "com.551uk.chatgptios16"
          assert app["CFBundleDisplayName"] == "ChatGPT"
          assert "CFBundleURLTypes" not in app, "ChatGPT must never claim Reynard/http/https URL schemes"
          assert helper["CFBundleIdentifier"] == "com.551uk.chatgptios16.Helper"
          assert "NSMicrophoneUsageDescription" in app
          assert "NSMicrophoneUsageDescription" in helper
          print("Verified app isolation: separate app/profile/helper, microphone declarations, no browser URL schemes")
          PY
          grep -Fq 'CGControllerDidLayout' src/ChatGPTShell.m
          grep -Fq 'CGAlwaysHideChrome' src/ChatGPTShell.m
          grep -Fq 'UIScreenEdgePanGestureRecognizer' src/ChatGPTShell.m
          grep -Fq 'goBackKeyCommand:' src/ChatGPTShell.m
          ! grep -Fq 'goForwardKeyCommand:' src/ChatGPTShell.m
          ! grep -Fq 'ChatGPTBottomNavigation' src/ChatGPTShell.m
          ! grep -Fq 'ChatGPTBackButton' src/ChatGPTShell.m
          ! grep -Fq 'ChatGPTForwardButton' src/ChatGPTShell.m
          grep -Fq 'CGChromeSafeAreaInsets' src/ChatGPTShell.m
          grep -Fq 'CGZeroBottomToolbarFrame' src/ChatGPTShell.m
          grep -Fq 'CGPreallowChatGPTMicrophoneSite' src/ChatGPTShell.m
          grep -Fq 'What can you do?' web/chatgpt-app-shell.js
          grep -Fq 'chatgpt is ai and can make mistakes' web/chatgpt-app-shell.js
          grep -Fq 'chats may be reviewed and used to improve our ai models' web/chatgpt-app-shell.js
          grep -Fq 'cg-ios16-composer' web/chatgpt-app-shell.js
          grep -Fq 'safe-area-inset-bottom' web/chatgpt-app-shell.js
          grep -Fq 'data-cg-ios16-preparing' web/chatgpt-app-shell.js
          grep -Fq '"run_at": "document_start"' scripts/package.sh
          find build/work/unpacked/Payload/ChatGPT.app -path '*/extensions/readerview/chatgpt-app-shell.js' -type f | grep -q .
          ! grep -Fq 'ChatGPTAppOptions' src/ChatGPTShell.m
          ! grep -Fq 'ChatGPTNewChat' src/ChatGPTShell.m
          ! grep -Fq 'composeButton' src/ChatGPTShell.m
          grep -Fq 'Reynard-Jailbroken.ipa' scripts/package.sh
          # The actual runtime navigation/microphone UI must be device-tested.
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Gecko-iOS16
          path: |
            dist/ChatGPT-Gecko-iOS16.ipa
            dist/*.deb
          if-no-files-found: error
      - name: Publish latest test build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Skipping outdated build release'
            exit 0
          fi
          TAG="gecko-test"
          NOTES="ChatGPT iOS 16 Gecko test v0.19.0-12. Keeps the full-screen swipe-back-only interface and working microphone behavior. The ChatGPT cleanup extension now runs at document_start, hides the document before first paint, removes the unwanted footer/disclaimer and 'What can you do?' suggestion, positions the composer, then reveals the cleaned page. This prevents those web-only elements visibly flashing on startup. A 1.4-second failsafe always reveals the page if ChatGPT markup changes. Rootless Dopamine DEB plus test IPA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ChatGPT-Gecko-iOS16.ipa dist/*.deb --clobber
            gh release edit "$TAG" --title 'ChatGPT Gecko iOS 16 (test)' --notes "$NOTES"
          else
            gh release create "$TAG" dist/ChatGPT-Gecko-iOS16.ipa dist/*.deb --prerelease --title 'ChatGPT Gecko iOS 16 (test)' --notes "$NOTES"
          fi
