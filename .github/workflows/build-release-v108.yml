name: Build ChatGPT v1.08 Firefox-confirmed mobile sidebar
on:
  push:
    branches: [sidebar-popover-75vw-v108]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - '.github/workflows/build-release-v108.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged v1.01 baseline except exact sidebar width rule
        run: |
          set -euo pipefail
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh
          git diff --exit-code origin/sidebar-icon-true-black-v101 HEAD -- src prefs
          grep -Fq 'Version: 0.19.0-108' scripts/package.sh
          grep -Fq 'manifest["version"] = "1.0.108"' scripts/package.sh
          node <<'JS'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const cp = require('child_process');
          const original = cp.execFileSync('git', ['show', 'origin/sidebar-icon-true-black-v101:web/chatgpt-app-shell.js'], {encoding:'utf8'});
          const actual = fs.readFileSync('web/chatgpt-app-shell.js', 'utf8');
          const anchor = '    ".cg-ios16-sidebar-title-offset { translate: 10% 0 !important; }",';
          const onlyAdded = '    // v1.08: Firefox-confirmed exact sidebar popover on mobile (75vw = 322.5px at 430px).\n    // Keep chat titles, buttons, navigation, header and scroll behavior untouched.\n    "@media (max-width: 799px) { #browser-sidebar-popover { width: 75vw !important; } }",';
          assert.equal(original.split(anchor).length, 2, 'v1.01 anchor must exist once');
          assert.equal(actual, original.replace(anchor, anchor + '\n' + onlyAdded), 'Unexpected changes from v1.01');
          assert.equal((actual.match(/#browser-sidebar-popover/g) || []).length, 1, 'Target exactly one popover');
          console.log('PASS: only Firefox-proven exact #browser-sidebar-popover width rule added.');
          JS
          node tests/header-icons-black.test.cjs
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build v1.08
        run: bash scripts/package.sh
      - name: Verify rootless DEB
        run: |
          set -euo pipefail
          file=dist/com.551uk.chatgptgecko_0.19.0-108_iphoneos-arm64.deb
          test -s "$file"
          test "$(dpkg-deb --field "$file" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$file" Version)" = "0.19.0-108"
          test "$(dpkg-deb --field "$file" Architecture)" = "iphoneos-arm64"
          dpkg-deb --contents "$file" > /tmp/chatgpt-v108-contents.txt
          grep -Fq 'ChatGPT.app/' /tmp/chatgpt-v108-contents.txt
          grep -Fq 'ChatGPTPrefs.bundle/' /tmp/chatgpt-v108-contents.txt
          shasum -a 256 "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-108-verified-sidebar-75
          path: dist/com.551uk.chatgptgecko_0.19.0-108_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Publish v1.08 test prerelease; leave stable v1.01 untouched
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=dist/com.551uk.chatgptgecko_0.19.0-108_iphoneos-arm64.deb
          if gh release view v1.08 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.08 "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.08 "$file" --repo "$GITHUB_REPOSITORY" --target sidebar-popover-75vw-v108 --prerelease --title "ChatGPT v1.08 - Verified Mobile Sidebar 75%" --notes "Based directly on untouched stable v1.01. Changes only the confirmed #browser-sidebar-popover element to width:75vw at mobile viewport sizes. On 430px viewport it measures 322.5px, tested in Firefox. No chat title/text/button/icon changes, no diagnostics, no inner navigation or scroll changes."
          fi
          gh release view v1.08 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name,.size,.url] | @tsv'
