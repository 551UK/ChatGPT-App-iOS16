name: Build ChatGPT v1.23 - correct Swipe Back icon direction

on:
  push:
    branches: [settings-swipe-back-icon-v123]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - '.github/workflows/build-settings-back-icon-v123.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-back-icon-v123
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Verify Swipe Back icon only from v1.23
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin settings-right-edge-guide-v122 --depth=1
          # Confirm the v1.21 working gesture and presentation source is unchanged.
          git diff --quiet origin/settings-right-edge-guide-v122 HEAD -- src web scripts/rebrand.py scripts/inject.py scripts/icon.py prefs/Resources/Root.plist prefs/CGPClearDataController.m prefs/Makefile prefs/PreferenceLoader.plist prefs/Resources/Info.plist
          ! git diff --quiet origin/settings-right-edge-guide-v122 HEAD -- prefs/ChatGPTPrefs.m
          python3 - <<'PY_CARD'
          from pathlib import Path
          prefs=Path("prefs/ChatGPTPrefs.m").read_text()
          old="Swipe right from the left edge to go back one page."
          new="Swipe left from the right edge to refresh the page, even in long chats."
          assert old in prefs
          assert prefs.count('heading.text = refresh ? @"Swipe to Refresh" : @"Swipe Back";') == 1
          assert prefs.count('NSString *symbol = refresh ? @"arrow.left.circle" : @"arrow.right";') == 1
          assert 'arrow.backward' not in prefs
          assert new in prefs
          assert "Pull to Refresh" not in prefs
          assert "Drag down on a ChatGPT page to refresh it." not in prefs
          assert prefs.count(old) == 1
          print("PASS: Back icon faces right; Refresh left icon, cards and gestures unchanged")
          PY_CARD
          node --check web/chatgpt-app-shell.js
          bash -n scripts/package.sh
          python3 - <<'PY_CHECK'
          from pathlib import Path
          js = Path("web/chatgpt-app-shell.js").read_text()
          code = js.split("function restoreMainHeaderLeftIconSizes(chosenSvgs) {", 1)[1].split("\n  // v1.01", 1)[0]
          assert "stabilizeTopActionBar" not in code
          assert "keepHeaderShareEnlarged" not in code
          assert "button.closest(panelSelector)" in code
          assert "pair.length !== 2" in code
          assert 'data-cg-left-header-icon' in code
          assert 'restoreMainHeaderLeftIconSizes(chosen);' in js
          assert "html body .cg-ios16-left-header-size-stable" in js
          assert "makeTopLeftHeaderIconsBlack();" in js
          assert "recoverHeaderInkAfterTransition()" in js
          assert "schedule(mutationChangesHeader(mutations))" in js
          assert '#browser-sidebar-popover { width: 75vw' in js
          assert 'html body .cg-ios16-share-control-stable { transform: scale(1.30)' in js
          assert js.count("HEADER_WHITE_BAR_TRIM_PX") == 3
          assert "const HEADER_WHITE_BAR_TRIM_PX = 3;" in js
          assert "Math.min(bestRect.height, Math.ceil(rowBottom - bestRect.top)) -" in js
          assert "Math.min(r.height, Math.ceil(lastButtonBottom - r.top)) -" in js
          # v1.19: keep the MAIN header button (not only an SVG that React
          # can replace during scrolling) permanently black.
          assert "html body .cg-ios16-left-header-size-stable { color: #000000 !important; opacity: 1 !important; }" in js
          assert "html body .cg-ios16-left-header-size-stable svg { filter: brightness(0) !important;" in js
          assert "html body .cg-ios16-left-header-size-stable svg * { opacity: 1 !important; }" in js
          assert "html body .cg-ios16-topbar-control[data-cg-icon-role='sidebar'] svg" in js
          assert "button.closest(panelSelector)" in js

          assert "function hasUsableConversationHeaderBackground() {" in js
          assert "if (!hasUsableConversationHeaderBackground())" in js
          assert "if (timer !== null) return;" in js
          assert "clearTimeout(timer);" not in js
          assert "}, 64);" in js
          assert "for (const delay of [120, 360, 800, 1600, 3200])" in js
          assert "function restoreConversationHeaderBackground()" in js
          assert "makeTopLeftHeaderIconsBlack();" in js
          print("PASS: restore main header icon sizes without touching the sidebar dismiss control or Share")
          PY_CHECK
          grep -Fq 'manifest["version"] = "1.0.123"' scripts/package.sh
          grep -Fq 'Version: 0.19.0-123' scripts/package.sh
      - name: Package ChatGPT v1.23
        run: bash scripts/package.sh
      - name: Inspect rootless DEB and embedded styling script
        shell: bash
        run: |
          set -euo pipefail
          f=dist/com.551uk.chatgptgecko_0.19.0-123_iphoneos-arm64.deb
          test -s "$f"
          test "$(dpkg-deb --field "$f" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$f" Version)" = "0.19.0-123"
          test "$(dpkg-deb --field "$f" Architecture)" = "iphoneos-arm64"
          python3 - <<'PY_CHECK'
          import json, plistlib
          from pathlib import Path
          app=Path("build/work/unpacked/Payload/ChatGPT.app")
          assert plistlib.loads((app/"Info.plist").read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16"
          helper=app/"PlugIns/Reynard Helper.appex/Info.plist"
          assert plistlib.loads(helper.read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16.Helper"
          manifest=next(app.rglob("extensions/readerview/manifest.json"))
          m=json.loads(manifest.read_text())
          assert m["version"]=="1.0.123"
          assert any("chatgpt-app-shell.js" in e.get("js",[]) for e in m.get("content_scripts",[]))
          code=(manifest.parent/"chatgpt-app-shell.js").read_text()
          assert "restoreMainHeaderLeftIconSizes(chosen);" in code
          assert "cg-ios16-left-header-size-stable" in code
          assert "const HEADER_WHITE_BAR_TRIM_PX = 3;" in code
          assert code.count("HEADER_WHITE_BAR_TRIM_PX") == 3
          assert "function restoreConversationHeaderBackground() {" in code
          repair = code.split("function restoreConversationHeaderBackground() {", 1)[1].split("\n  function applyAppPresentation(", 1)[0]
          assert "stabilizeTopActionBar()" not in repair
          assert "cg-ios16-solid-topbar" in repair
          assert 'window.location.pathname === "/"' in repair
          assert "if (element.closest(panelSelector)) return false" in repair
          recovery = code.split("function recoverHeaderInkAfterTransition() {", 1)[1].split("\n  function sidebarInteraction(", 1)[0]
          assert "restoreConversationHeaderBackground();" in recovery
          assert "recoverInkAndWhiteStrip();" in recovery
          assert code.count("HEADER_WHITE_BAR_TRIM_PX") == 3
          assert "Math.min(bestRect.height, Math.ceil(rowBottom - bestRect.top)) -" in code
          assert "Math.min(r.height, Math.ceil(lastButtonBottom - r.top)) -" in code
          assert "const HEADER_WHITE_BAR_TRIM_PX = 3;" in code
          assert 'window.addEventListener("popstate"' in code
          assert "html body .cg-ios16-left-header-size-stable { color: #000000 !important; opacity: 1 !important; }" in code
          assert "html body .cg-ios16-left-header-size-stable svg { filter: brightness(0) !important;" in code
          assert "html body .cg-ios16-topbar-control[data-cg-icon-role='sidebar'] svg" in code

          assert "function hasUsableConversationHeaderBackground() {" in code
          assert "if (!hasUsableConversationHeaderBackground())" in code
          assert "if (timer !== null) return;" in code
          assert "clearTimeout(timer);" not in code
          assert "for (const delay of [120, 360, 800, 1600, 3200])" in code
          print("PASS: Embedded Gecko script restores chat white bar separately from icon sizing")
          prefs_source=Path("prefs/ChatGPTPrefs.m").read_text()
          assert 'heading.text = refresh ? @"Swipe to Refresh" : @"Swipe Back";' in prefs_source
          assert "Swipe left from the right edge to refresh the page, even in long chats." in prefs_source
          assert 'NSString *symbol = refresh ? @"arrow.left.circle" : @"arrow.right";' in prefs_source
          assert "Swipe right from the left edge to go back one page." in prefs_source
          PY_CHECK
          shasum -a 256 "$f"
      - name: Upload verified DEB
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-123-Back-Icon
          path: dist/com.551uk.chatgptgecko_0.19.0-123_iphoneos-arm64.deb
      - name: Publish optional testing release (if permitted)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create chatgpt-back-icon-v123 \
            dist/com.551uk.chatgptgecko_0.19.0-123_iphoneos-arm64.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ChatGPT v1.23 — Correct Back gesture arrow" \
            --notes "Settings-only v1.23 from confirmed v1.22. Changes ONLY the Swipe Back guide icon from the left-pointing SF Symbol arrow.backward to arrow.right. Refresh still uses blue arrow.left.circle. Both descriptions, actual gestures, app shell, extension JS, all other Settings and Gecko are preserved. v1.22 source and release remain untouched."