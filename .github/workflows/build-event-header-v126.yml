name: Build ChatGPT v1.26 event-driven header (no message scans)

on:
  push:
    branches: [event-driven-header-v126]
    paths:
      - 'web/chatgpt-app-shell.js'
      - 'scripts/package.sh'
      - 'tests/header-only-v126.test.cjs'
      - '.github/workflows/build-event-header-v126.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-event-header-v126
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v1.25 native code unchanged and streaming regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin restore-exact-last-page-v125 --depth=1
          git diff --exit-code origin/restore-exact-last-page-v125 HEAD -- src prefs scripts/icon.py scripts/rebrand.py scripts/inject.py
          node --check web/chatgpt-app-shell.js
          node tests/header-only-v126.test.cjs
          bash -n scripts/package.sh
          grep -Fq 'Version: 0.19.0-126' scripts/package.sh
          grep -Fq 'manifest["version"] = "1.0.126"' scripts/package.sh
          grep -Fq 'CG_HOME_ROUTE_TITLE_MARKER' web/chatgpt-app-shell.js
          grep -Fq 'syncRestorableHomeState' web/chatgpt-app-shell.js
          if grep -Fq 'observer.observe(document.documentElement' web/chatgpt-app-shell.js; then
            echo 'ERROR: full-page observer must not be restored'; exit 1
          fi
      - name: Install dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install 'lief>=0.17,<0.18' 'Pillow>=10,<13'
      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Package event-driven ChatGPT v1.26
        run: bash scripts/package.sh
      - name: Verify DEB and embedded JS exactly match tested source
        shell: bash
        run: |
          set -euo pipefail
          f=dist/com.551uk.chatgptgecko_0.19.0-126_iphoneos-arm64.deb
          test -s "$f"
          test "$(dpkg-deb --field "$f" Package)" = "com.551uk.chatgptgecko"
          test "$(dpkg-deb --field "$f" Version)" = "0.19.0-126"
          test "$(dpkg-deb --field "$f" Architecture)" = "iphoneos-arm64"
          python3 - <<'PY'
          import json,plistlib,hashlib
          from pathlib import Path
          app=Path("build/work/unpacked/Payload/ChatGPT.app")
          assert plistlib.loads((app/"Info.plist").read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16"
          helper=app/"PlugIns/Reynard Helper.appex/Info.plist"
          assert plistlib.loads(helper.read_bytes())["CFBundleIdentifier"]=="com.551uk.chatgptios16.Helper"
          manifest=next(app.rglob("extensions/readerview/manifest.json"))
          m=json.loads(manifest.read_text())
          assert m["version"]=="1.0.126"
          assert any("chatgpt-app-shell.js" in x.get("js",[]) for x in m["content_scripts"])
          embedded=manifest.parent/"chatgpt-app-shell.js"
          source=Path("web/chatgpt-app-shell.js")
          assert embedded.read_bytes()==source.read_bytes()
          assert "const headerObserver = new MutationObserver" in embedded.read_text()
          assert "const titleTextObserver = new MutationObserver" in embedded.read_text()
          assert "observer.observe(document.documentElement" not in embedded.read_text()
          print("Verified embedded JS SHA256:",hashlib.sha256(embedded.read_bytes()).hexdigest())
          PY
          shasum -a 256 "$f"
      - name: Upload verified test package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-0.19.0-126-Event-Driven-Header
          path: dist/com.551uk.chatgptgecko_0.19.0-126_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Publish isolated v1.26 test prerelease, preserve v1.25
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=dist/com.551uk.chatgptgecko_0.19.0-126_iphoneos-arm64.deb
          if gh release view chatgpt-event-header-v126 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload chatgpt-event-header-v126 "$f" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create chatgpt-event-header-v126 "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --target event-driven-header-v126 --prerelease \
              --title "ChatGPT v1.26 - Event-driven Header / Gecko Resume" \
              --notes "Directly based on working v1.25 with original native last-page restore. Entire page is no longer monitored for DOM message changes. Targeted header-only childList observer, title-only home persistence observer, CSS-retained black icons, coalesced resume events. Automated test validates 5000 message updates trigger zero header scans. Device testing is required before claiming the Gecko JIT crash is resolved. Original v1.25 untouched."
          fi
          gh release view chatgpt-event-header-v126 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$f")"
